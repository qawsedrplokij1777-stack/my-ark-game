name: Build Web-to-APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Direct Gradle 8.2
        run: |
          mkdir -p my-app/src/main/assets
          mkdir -p my-app/src/main/java/com/game/app
          
          # نسخ ملف اللعبة
          cp *.html my-app/src/main/assets/index.html || echo "No html found"

          # Manifest
          cat << 'EOF' > my-app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.game.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Ark Game">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Java Activity
          cat << 'EOF' > my-app/src/main/java/com/game/app/MainActivity.java
          package com.game.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # build.gradle
          cat << 'EOF' > my-app/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1'
          }
          android {
              namespace 'com.game.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.game.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':my-app'
          EOF

          # تحميل وتثبيت Gradle 8.2 يدوياً
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH

          # بناء التطبيق
          cd my-app
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: my-app/build/outputs/apk/debug/my-app-debug.apk

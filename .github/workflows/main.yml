name: Build Web-to-APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Minimal Android Project
        run: |
          mkdir -p my-app/app/src/main/java/com/game/app
          mkdir -p my-app/app/src/main/assets
          
          # نسخ ملف اللعبة وتحويله إلى index.html تلقائياً
          cp *.html my-app/app/src/main/assets/index.html || echo "No html found"

          # إنشاء ملف الإعدادات AndroidManifest.xml
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.game.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Ark Game"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # إنشاء ملف تشغيل العرض MainActivity.java
          cat << 'EOF' > my-app/app/src/main/java/com/game/app/MainActivity.java
          package com.game.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # إنشاء ملف البناء build.gradle للتطبيق
          cat << 'EOF' > my-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.game.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.game.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # إنشاء ملفات الجرودل الأساسية
          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > my-app/settings.gradle
          rootProject.name = "My Game App"
          include ':app'
          EOF

          echo "android.useAndroidX=true" > my-app/gradle.properties

      - name: Build APK with Gradle
        run: |
          cd my-app
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: my-app/app/build/outputs/apk/debug/app-debug.apk

name: Build Quest APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build APK
        run: |
          GAME=$(ls *.html | head -1)
          OWNER="${{ github.repository_owner }}"; OWNER="${OWNER,,}"
          REPO="${{ github.event.repository.name }}"
          URL="https://$OWNER.github.io/$REPO/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$GAME")"
          echo "Game URL: $URL"
          mkdir -p my-app/src/main/java/com/game/app
          cat > my-app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="VR Game">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > my-app/src/main/java/com/game/app/MainActivity.java <<'EOF'
          package com.game.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Uri u = Uri.parse("GAME_URL");
                  Intent i = new Intent(Intent.ACTION_VIEW, u);
                  i.setPackage("com.oculus.browser");
                  try { startActivity(i); }
                  catch (Exception e) { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                  finish();
              }
          }
          EOF
          sed -i "s|GAME_URL|$URL|" my-app/src/main/java/com/game/app/MainActivity.java
          cat > my-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.1' }
          android {
              namespace 'com.game.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.game.app"
                  minSdk 23
                  targetSdk 32
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':my-app'
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH
          cd my-app && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: my-app/build/outputs/apk/debug/my-app-debug.apk
